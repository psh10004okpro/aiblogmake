[pytest]
# 최소 pytest 버전
minversion = 8.0

# 테스트 파일 검색 경로
testpaths = tests

# 테스트 파일 패턴
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 마커 정의
markers =
    unit: 단위 테스트 (빠른 실행, 외부 의존성 없음)
    integration: 통합 테스트 (데이터베이스, API 등)
    e2e: End-to-End 테스트 (전체 워크플로우)
    slow: 느린 테스트 (오래 걸리는 테스트)
    api: API 엔드포인트 테스트
    service: 서비스 레이어 테스트
    utils: 유틸리티 함수 테스트
    database: 데이터베이스 관련 테스트
    external: 외부 API 호출 테스트 (모킹 필요)

# asyncio 설정
asyncio_mode = auto

# 출력 옵션
addopts =
    # 상세 출력
    -v
    # 테스트 요약 표시
    -ra
    # 경고 표시
    --strict-markers
    # 커버리지 측정
    --cov=app
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    # 최소 커버리지 (70%)
    --cov-fail-under=70
    # 색상 출력
    --color=yes
    # 중복 테스트 경고
    --strict-config
    # 느린 테스트 표시 (5초 이상)
    --durations=10
    # 실패 시 즉시 중단하지 않음
    --maxfail=5
    # 트레이스백 형식
    --tb=short

# 경고 필터
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:playwright.*
    ignore::pytest.PytestUnraisableExceptionWarning

# 로그 설정
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 테스트 검색 제외 경로
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    env
    node_modules
    alembic

# 콘솔 출력 캡처
console_output_style = progress

# xfail 설정
xfail_strict = false
